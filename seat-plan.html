<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
  import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
  import { getFirestore, doc, getDoc, setDoc, serverTimestamp }
           from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

  // login.html এর config-এর সাথে হুবহু একই
  const firebaseConfig = {
    apiKey: "YOUR_API_KEY",
    authDomain: "ssc-seat-plan.firebaseapp.com",
    projectId: "ssc-seat-plan",
    storageBucket: "ssc-seat-plan.appspot.com",
    messagingSenderId: "YOUR_SENDER_ID",
    appId: "YOUR_APP_ID"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  // লগইন না থাকলে বা অ্যাকাউন্ট active না হলে login.html এ পাঠাবে
  window.fbReady = new Promise((resolve) => {
    onAuthStateChanged(auth, async (user) => {
      if (!user) { window.location.href = 'login.html'; return; }
      try {
        const snap = await getDoc(doc(db, 'users', user.uid));
        if (!snap.exists() || snap.data().status !== 'active') {
          await signOut(auth);
          window.location.href = 'login.html';
          return;
        }
        window.currentUserProfile = snap.data();
        resolve({ auth, db, doc, setDoc, serverTimestamp });
      } catch (err) {
        console.error('ইউজার যাচাইয়ে ত্রুটি:', err);
        window.location.href = 'login.html';
      }
    });
  });

  window.logout = async function () {
    await signOut(auth);
    window.location.href = 'login.html';
  };
</script>
