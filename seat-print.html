<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>সিট প্লান প্রিন্ট</title>
<style id="pageSize"></style>
<style>
  /* ফন্ট: সোলিমান লিপি (প্রধান), কালপুরুষ (বিকল্প) — সরাসরি CDN থেকে */
  @font-face { font-family:'SolaimanLipi'; src:local('SolaimanLipi'), local('Solaiman Lipi'), url('https://cdn.jsdelivr.net/npm/@hixbe/solaiman-lipi@5.2.5/files/solaiman-lipi.woff2') format('woff2'); font-weight:400; font-display:swap; }
  @font-face { font-family:'Kalpurush'; src:url('https://cdn.jsdelivr.net/npm/@hixbe/kalpurush@5.2.5/files/kalpurush.woff2') format('woff2'); font-weight:400; font-display:swap; }
  :root { --navy:#1D2B4F; --gold:#B9822E; --band:#DCEFDC; --cream:#FFF2CC; --sky:#DDEBF7; }
  * { box-sizing: border-box; }
  body { font-family:'Times New Roman',Times,'SolaimanLipi','Kalpurush','Noto Sans Bengali',serif; margin:0; background:#EEF1F8; color:#000; }

  /* ---- টুলবার (প্রিন্টে দেখাবে না) ---- */
  .toolbar { position:sticky; top:0; z-index:10; background:var(--navy); color:#fff; padding:12px 16px; display:flex; gap:10px; flex-wrap:wrap; align-items:center; font-family:'Times New Roman',Times,'SolaimanLipi','Kalpurush',sans-serif; }
  .toolbar select, .toolbar button { font-family:inherit; font-size:14px; padding:8px 12px; border-radius:8px; border:none; }
  .toolbar button { background:var(--gold); color:#fff; font-weight:600; cursor:pointer; }
  .toolbar button.alt { background:#fff; color:var(--navy); }
  #msg { padding:30px; text-align:center; }

  /* ---- Legal পাতা (পুরোনো PDF-এর মাপ: 8.5in x 14in) ---- */
  .page { background:#fff; width:var(--pw,8.5in); min-height:var(--ph,14in); margin:16px auto; padding:0.25in 0.3in; box-shadow:0 4px 16px rgba(0,0,0,.15); page-break-after:always; }
  .page.hidden { display:none; }
  .page { line-height:1.05; }

  .h1 { text-align:center; font-size:32pt; font-weight:700; margin:0 0 2pt; line-height:1.05; }
  .h2 { text-align:center; font-size:21pt; font-weight:500; margin:0; line-height:1.1; }
  .row-between { display:flex; justify-content:space-between; font-size:19pt; font-weight:700; border-bottom:2.5pt solid #000; padding:4pt 0 2pt; margin-top:6pt; line-height:1.05; }
  .venue { font-size:29pt; font-weight:700; margin:4pt 0 4pt; line-height:1.05; }

  .plan-title { width:46%; margin:0 auto; text-align:center; background:var(--sky); border:1px solid #000; border-bottom:none; font-size:29pt; font-weight:700; padding:1pt 0; line-height:1.05; }
  table.info { width:100%; border-collapse:collapse; font-size:19pt; font-weight:600; }
  table.info td { border:1px solid #000; padding:2pt 8pt; line-height:1.05; }
  table.info td.mid { width:30%; text-align:center; font-size:28pt; font-weight:700; }
  table.info td.side { width:35%; }
  table.info td.side.r { text-align:right; }
  .building { width:44%; margin:0 auto; text-align:center; border:1px solid #000; border-top:none; font-size:20pt; font-weight:600; padding:1pt 4pt; line-height:1.05; }

  table.sch { width:100%; border-collapse:collapse; margin-top:6pt; }
  table.sch th { font-size:24pt; font-weight:700; padding:1pt 4pt; line-height:1.05; border-bottom:2.5pt solid #000; }
  table.sch td { font-size:18pt; padding:0 4pt; height:9mm; line-height:1.05; border-bottom:1px solid #000; }
  table.sch tr.alt td { background:#F2F2F2; }
  table.sch td.name { text-align:left; }
  table.sch td.roll { text-align:center; font-weight:700; font-size:21pt; font-family:'Times New Roman',Times,serif; }
  table.sch td.cnt { text-align:right; font-weight:600; font-size:19pt; }
  table.sch tr { page-break-inside:avoid; }
  table.sch th:nth-child(1) { text-align:left; }
  table.sch th:nth-child(2) { text-align:center; }
  table.sch th:nth-child(3) { text-align:right; }

  .total { background:var(--band); text-align:right; font-weight:700; font-size:25pt; padding:1pt 8pt; margin-top:4pt; line-height:1.1; }

  /* ---- সিটের ছক: তিন জোড়া, প্রতি জোড়ায় বামটি বাঁ দিকে, ডানটি ডান দিকে ---- */
  table.seat { width:100%; border-collapse:collapse; table-layout:fixed; margin-top:2pt; }
  table.seat tr { page-break-inside:avoid; }
  table.seat td { height:11.7mm; padding:0 2pt 1.2mm; vertical-align:bottom; font-family:'Times New Roman',Times,serif; font-weight:700; font-size:25pt; line-height:1; border-bottom:1.5pt solid #000; white-space:nowrap; }
  /* ২ কলামে বেঞ্চ (সিটের ঘর) বড় */
  table.seat.two td { height:15mm; font-size:32pt; padding-bottom:1.8mm; }
  table.seat.two td.g { width:auto; }
  table.seat.two td.door { font-size:26pt; padding-bottom:0; }
  table.seat td.l { text-align:left; }
  table.seat td.rt { text-align:right; }
  table.seat td.g { width:24pt; border-bottom:none; background:#fff; padding:0; }
  table.seat tr.odd td:not(.g) { background:var(--cream); }
  table.seat td.blank { border-bottom-color:#eee; }
  table.seat td.door { vertical-align:middle; padding-bottom:0; background:var(--navy) !important; color:#fff; font-family:'Times New Roman',Times,serif; font-size:19pt; text-align:center; letter-spacing:.5pt; border:none; }

  /* কাগজের মাপ টুলবারের ড্রপডাউন থেকে JS দিয়ে বসে (নিচের #pageSize স্টাইল) */
  @media print {
    body { background:#fff; }
    .toolbar, #msg { display:none !important; }
    .page { margin:0; box-shadow:none; width:auto; min-height:auto; padding:0.25in 0.3in; }
    .page.hidden { display:none !important; }
    * { -webkit-print-color-adjust:exact; print-color-adjust:exact; }
  }
</style>
</head>
<body>

<div class="toolbar">
  <select id="roomSelect"></select>
  <select id="paperSelect" title="কাগজের মাপ">
    <option value="legal">কাগজ: Legal (8.5×14 ইঞ্চি)</option>
    <option value="a4">কাগজ: A4 (8.27×11.69 ইঞ্চি)</option>
    <option value="letter">কাগজ: Letter (8.5×11 ইঞ্চি)</option>
    <option value="folio">কাগজ: Folio (8.5×13 ইঞ্চি)</option>
  </select>
  <button onclick="window.print()">🖨️ প্রিন্ট করুন</button>
  <button class="alt" id="btnTwo" onclick="printType('two')">২ কলাম প্রিন্ট</button>
  <button class="alt" id="btnThree" onclick="printType('three')">৩ কলাম প্রিন্ট</button>
  <button class="alt" onclick="window.location.href='seat-plan.html'">← ফিরে যান</button>
</div>

<div id="msg">লোড হচ্ছে...</div>
<div id="sheets"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import { getFirestore, doc, getDoc, getDocs, collection } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBEK87giX4dJunYNjD6aH6VYXQ5IaCVgx8",
  authDomain: "ssc-seat-plan.firebaseapp.com",
  projectId: "ssc-seat-plan",
  storageBucket: "ssc-seat-plan.firebasestorage.app",
  messagingSenderId: "56229919406",
  appId: "1:56229919406:web:1b33d7f269214d03efcb3f"
};

// ===== পরিবর্তনযোগ্য কেন্দ্রের তথ্য =====
const CENTER = {
  exam: 'এস.এস.সি পরীক্ষা - ২০২৬',
  name: 'পরীক্ষা কেন্দ্র - কাশিয়ানী',
  school: '(কাশিয়ানী গিরীশ চন্দ্র পাইলট উচ্চ বিদ্যালয়)',
  place: 'কাশিয়ানী, গোপালগঞ্জ।',
  code: '৩৩৩',
  mobile: '০১৭১৫২২২৫৮৬',
  venue: 'কাশিয়ানী গিরীশ চন্দ্র পাইলট উচ্চ বিদ্যালয়'
};

// সিটের কলামের ক্রম (seat-plan.html-এর সাথে একই): দুটি করে জোড়া
const COLUMNS = ['C','D','F','G','I','J'];

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const bn = n => String(n).replace(/\d/g, d => '০১২৩৪৫৬৭৮৯'[d]);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ms = p => (p.updatedAt && p.updatedAt.toMillis) ? p.updatedAt.toMillis() : 0;
const floorText = f => { const t = String(f || '').trim(); return t === 'নিচতলা' ? 'নিচ তলা' : t; };

// ---- কাগজের মাপ (পছন্দমতো) ----
const PAPERS = { legal:['8.5in','14in'], a4:['210mm','297mm'], letter:['8.5in','11in'], folio:['8.5in','13in'] };
function applyPaper(key) {
  const [w, h] = PAPERS[key] || PAPERS.legal;
  document.documentElement.style.setProperty('--pw', w);
  document.documentElement.style.setProperty('--ph', h);
  document.getElementById('pageSize').textContent = `@page { size:${w} ${h}; margin:0; }`;
}
(function initPaper() {
  const sel = document.getElementById('paperSelect');
  let saved = 'legal';
  try { saved = localStorage.getItem('paperSize') || 'legal'; } catch (_) {}
  if (!PAPERS[saved]) saved = 'legal';
  sel.value = saved;
  applyPaper(saved);
  sel.addEventListener('change', () => {
    applyPaper(sel.value);
    try { localStorage.setItem('paperSize', sel.value); } catch (_) {}
  });
})();

let plans = [];

onAuthStateChanged(auth, async (user) => {
  if (!user) { location.href = 'index.html'; return; }
  try {
    const u = await getDoc(doc(db, 'users', user.uid));
    if (!u.exists() || u.data().status !== 'active') {
      await signOut(auth); location.href = 'index.html'; return;
    }
    await loadPlans();
  } catch (err) {
    console.error(err);
    document.getElementById('msg').textContent =
      'ডেটা লোড করা যায়নি: ' + (err.code === 'permission-denied' ? 'Firestore Rules-এ seatPlans পড়ার অনুমতি নেই।' : err.message);
  }
});

async function loadPlans() {
  const snap = await getDocs(collection(db, 'seatPlans'));
  plans = snap.docs.map(d => ({ id: d.id, ...d.data() }));

  if (plans.length === 0) {
    document.getElementById('msg').textContent = 'কোনো সিট প্লান পাওয়া যায়নি। আগে সাবমিট করুন।';
    return;
  }

  // সবচেয়ে সাম্প্রতিক সাবমিট করা কক্ষটি ডিফল্ট
  const latestId = [...plans].sort((a, b) => ms(b) - ms(a))[0].id;

  plans.sort((a, b) => String(a.roomInfo?.roomNumber || '').localeCompare(String(b.roomInfo?.roomNumber || ''), 'bn', { numeric: true }));
  document.getElementById('msg').style.display = 'none';

  const sel = document.getElementById('roomSelect');
  sel.innerHTML = plans.map(p => {
    const r = p.roomInfo || {};
    return `<option value="${esc(p.id)}">কক্ষ ${esc(r.roomNumber)} — ${esc(r.building)} (${esc(floorText(r.floor))})</option>`;
  }).join('');
  sel.addEventListener('change', () => showOne(sel.value));

  document.getElementById('sheets').innerHTML = plans.map(renderPlan).join('');
  document.getElementById('btnTwo').textContent = '২ কলাম প্রিন্ট - ' + bn(document.querySelectorAll('.page.two').length) + ' কক্ষ';
  document.getElementById('btnThree').textContent = '৩ কলাম প্রিন্ট - ' + bn(document.querySelectorAll('.page.three').length) + ' কক্ষ';

  const wanted = new URLSearchParams(location.search).get('room');
  const start = plans.find(p => p.id === wanted) ? wanted : latestId;
  sel.value = start;
  showOne(start);
}

function showOne(id) {
  document.querySelectorAll('.page').forEach(p => p.classList.toggle('hidden', p.dataset.id !== id));
}
// নির্দিষ্ট ধরনের (২ বা ৩ কলাম) সব কক্ষ একসাথে প্রিন্ট
window.printType = function (type) {
  const pages = document.querySelectorAll('.page.' + type);
  if (pages.length === 0) {
    alert(type === 'two' ? 'কোনো ২ কলামের কক্ষ নেই।' : 'কোনো ৩ কলামের কক্ষ নেই।');
    return;
  }
  document.querySelectorAll('.page').forEach(p => p.classList.toggle('hidden', !p.classList.contains(type)));
  window.print();
};
window.addEventListener('afterprint', () => {
  const sel = document.getElementById('roomSelect');
  if (sel && sel.value) showOne(sel.value);
});
window.showAll = function () {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('hidden'));
};

function renderPlan(p) {
  const r = p.roomInfo || {};
  const schools = p.schools || [];
  const totalStu = p.totals?.totalStudents || 0;

  // প্রতিটি কলামের সিট তালিকা (রোল না থাকলে null = ফাঁকা সিট)
  const seatsByCol = COLUMNS.map((_, i) => {
    const seats = [];
    ((p.columnData || [])[i]?.ranges || []).forEach(rg => {
      for (let k = 0; k < rg.count; k++) seats.push(rg.startRoll > 0 ? rg.startRoll + k : null);
    });
    return seats;
  });
  // সারি = সবচেয়ে লম্বা কলামের সিট সংখ্যা (প্রতি সারি = এক জোড়া সিট)
  const rows = Math.max(...seatsByCol.map(s => s.length)) || (r.benchCount || 0);
  // প্রতি কলাম নিচ থেকে মেলানো: কম সিটের কলামের উপরে ফাঁকা সারি বসবে
  seatsByCol.forEach(col => { while (col.length < rows) col.unshift(null); });
  // মাঝের জোড়ায় (F, G) কোনো রোল না থাকলে ২ কলাম, থাকলে ৩ কলাম
  const two = !seatsByCol[2].some(Boolean) && !seatsByCol[3].some(Boolean);
  const use = two ? [0, 1, 4, 5] : [0, 1, 2, 3, 4, 5];

  // DOOR: শেষ জোড়ার (I, J) প্রথম সারি ফাঁকা হলে সেখানে দরজা দেখাবে
  const doorRow0 = !seatsByCol[4][0] && !seatsByCol[5][0];

  let body = '';
  for (let i = 0; i < rows; i++) {
    let tr = `<tr class="${i % 2 === 0 ? 'odd' : 'even'}">`;
    use.forEach((ci) => {
      if ((!two && ci === 2) || ci === 4) tr += '<td class="g"></td>';
      if (i === 0 && doorRow0 && ci === 4) {
        tr += '<td class="door" colspan="2">DOOR</td>';
        return;
      }
      if (i === 0 && doorRow0 && ci === 5) return;
      const roll = seatsByCol[ci][i];
      const cls = (ci % 2 === 0) ? 'l' : 'rt';
      tr += roll ? `<td class="${cls}">${roll}</td>` : `<td class="blank ${cls}"></td>`;
    });
    body += tr + '</tr>';
  }

  const schoolRows = schools.map((s, i) =>
    `<tr class="${i % 2 ? 'alt' : ''}"><td class="name">${esc(s.name)}ঃ</td><td class="roll">${s.startRoll}-${s.endRoll}</td><td class="cnt">মোট ${s.studentCount} জন</td></tr>`
  ).join('');


  return `
  <div class="page ${two ? 'two' : 'three'}" data-id="${esc(p.id)}">
    <h1 class="h1">${CENTER.exam}</h1>
    <div class="h2">${CENTER.name}</div>
    <div class="h2">${CENTER.school}</div>
    <div class="h2">${CENTER.place}</div>
    <div class="row-between"><span>কেন্দ্র কোডঃ ${CENTER.code}</span><span>মোবাইল নম্বরঃ ${CENTER.mobile}</span></div>
    <div class="venue">ভেন্যুঃ ${CENTER.venue}</div>

    <div class="plan-title">আসন পরিকল্পনা</div>
    <table class="info">
      <tr>
        <td class="side">কক্ষ নংঃ ${esc(bn(r.roomNumber))} (${esc(r.gender)})</td>
        <td class="mid" rowspan="2">${esc(r.direction)}</td>
        <td class="side r">বিভাগঃ ${esc(r.department)}</td>
      </tr>
      <tr>
        <td class="side">বেঞ্চের সংখ্যাঃ ${bn(r.benchCount || 0)} খানা</td>
        <td class="side r">পরীক্ষার্থীর সংখ্যাঃ ${bn(totalStu)} জন</td>
      </tr>
    </table>
    <div class="building">${esc(r.building)} (${esc(floorText(r.floor))})</div>

    <table class="sch">
      <tr><th>বিদ্যালয়ের নাম</th><th>রোল নম্বর</th><th>সংখ্যা</th></tr>
      ${schoolRows}
    </table>
    <div class="total">মোট: ${totalStu} জন</div>

    <table class="seat ${two ? 'two' : ''}">${two ? '<colgroup><col style="width:22%"><col style="width:22%"><col style="width:12%"><col style="width:22%"><col style="width:22%"></colgroup>' : ''}${body}</table>
  </div>`;
}
</script>
</body>
</html>
