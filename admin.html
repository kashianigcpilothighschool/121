<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>অ্যাডমিন প্যানেল</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{--ink:#1F2D50;--paper:#FAF6EC;--card:#fff;--line:#E4E0D4;--gold:#A87E33;--ok:#23895B;--bad:#C0392B;--muted:#6B7280}
  @media (prefers-color-scheme: dark){:root{--ink:#E8ECF7;--paper:#101A33;--card:#1B2748;--line:#33456F;--gold:#D6A24E;--ok:#5FD3A0;--bad:#F0A89E;--muted:#9CA3AF}}
  *{box-sizing:border-box}
  body{margin:0;padding:24px 14px;font-family:'Hind Siliguri',sans-serif;background:var(--paper);color:var(--ink)}
  .wrap{max-width:980px;margin:0 auto}
  header{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:18px;flex-wrap:wrap}
  h1{margin:0;font-size:22px}
  button{font-family:inherit;cursor:pointer;border-radius:8px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);padding:7px 14px;font-weight:600}
  .tabs{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
  .tabs button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:10px;display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}
  .meta{font-size:13px;color:var(--muted);line-height:1.6}
  .name{font-weight:700;font-size:16px}
  .badge{font-size:12px;padding:2px 10px;border-radius:999px;border:1px solid var(--line)}
  .acts{display:flex;gap:8px}
  .ok{color:var(--ok);border-color:var(--ok)} .bad{color:var(--bad);border-color:var(--bad)}
  #msg{padding:10px 14px;border-radius:8px;margin-bottom:12px;display:none;border:1px solid var(--line);background:var(--card)}
</style>
</head>
<body>
<div class="wrap">
  <header><h1>🛡️ অ্যাডমিন প্যানেল</h1>
    <div><a href="seat-plan.html"><button>সিট প্ল্যান</button></a> <button id="logoutBtn">লগআউট</button></div></header>
  <div id="msg"></div>
  <div class="tabs" id="tabs"></div>
  <div id="list">লোড হচ্ছে...</div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
  import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
  import { getFirestore, doc, getDoc, getDocs, updateDoc, collection }
           from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

  // login.html-এর config-এর সাথে হুবহু এক
  const firebaseConfig = {
    apiKey: "YOUR_API_KEY",
    authDomain: "ssc-seat-plan.firebaseapp.com",
    projectId: "ssc-seat-plan",
    storageBucket: "ssc-seat-plan.appspot.com",
    messagingSenderId: "YOUR_SENDER_ID",
    appId: "YOUR_APP_ID"
  };
  const auth = getAuth(initializeApp(firebaseConfig));
  const db = getFirestore(auth.app);

  const LABEL = { pending: 'অপেক্ষমাণ', active: 'সক্রিয়', disabled: 'নিষ্ক্রিয়' };
  let users = [], tab = 'pending';

  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  function msg(t){ const m=document.getElementById('msg'); m.textContent=t; m.style.display='block'; setTimeout(()=>m.style.display='none',4000); }

  function render() {
    document.getElementById('tabs').innerHTML = Object.keys(LABEL).map(k =>
      `<button class="${k===tab?'on':''}" data-tab="${k}">${LABEL[k]} (${users.filter(u=>u.status===k).length})</button>`).join('');
    const rows = users.filter(u => u.status === tab);
    document.getElementById('list').innerHTML = rows.length ? rows.map(u => `
      <div class="card">
        <div><div class="name">${esc(u.name)} <span class="badge">${u.role==='admin'?'অ্যাডমিন':'ইউজার'}</span></div>
          <div class="meta">${esc(u.email)} · ${esc(u.mobile)}<br>অ্যাক্সেস: ${esc((u.classAccess||[]).join(', '))}</div></div>
        <div class="acts">
          ${u.status!=='active' ? `<button class="ok" data-act="active" data-id="${u.id}">অনুমোদন</button>` : ''}
          ${u.status!=='disabled' && u.role!=='admin' ? `<button class="bad" data-act="disabled" data-id="${u.id}">নিষ্ক্রিয়</button>` : ''}
        </div>
      </div>`).join('') : '<div class="meta">কোনো ইউজার নেই।</div>';
  }

  async function load() {
    const snap = await getDocs(collection(db, 'users'));
    users = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    render();
  }

  document.addEventListener('click', async e => {
    const t = e.target.closest('[data-tab]'); if (t) { tab = t.dataset.tab; render(); return; }
    const b = e.target.closest('[data-act]'); if (!b) return;
    b.disabled = true;
    try {
      await updateDoc(doc(db, 'users', b.dataset.id), { status: b.dataset.act });
      msg('✅ হালনাগাদ হয়েছে'); await load();
    } catch (err) { msg('ত্রুটি: ' + err.message); b.disabled = false; }
  });

  document.getElementById('logoutBtn').onclick = async () => { await signOut(auth); location.href = 'login.html'; };

  onAuthStateChanged(auth, async user => {
    if (!user) { location.href = 'login.html'; return; }
    try {
      const me = await getDoc(doc(db, 'users', user.uid));
      if (!me.exists() || me.data().status !== 'active' || me.data().role !== 'admin') {
        document.body.innerHTML = '<p style="padding:30px">❌ শুধু অ্যাডমিনের জন্য।</p>'; return;
      }
      await load();
    } catch (err) { document.getElementById('list').textContent = 'ত্রুটি: ' + err.message; }
  });
</script>
</body>
</html>
